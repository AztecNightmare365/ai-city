<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI CITY</title>
  <script type="module" crossorigin src="./assets/main-DBtX4uwj.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/BufferGeometryUtils-CQT_ibYB.js">
  <link rel="stylesheet" crossorigin href="./assets/main-BEkwVznh.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="boot">INITIALIZING CITY<span class="dots"></span></div>

  <header id="topbar">
    <div class="brand">AI<span>CITY</span></div>
    <div class="pill" id="market">--</div>
    <div class="pill mono" id="clock">--:--</div>
    <div class="spacer"></div>
    <div class="pill" id="link"><i class="dot"></i><span>bridge</span></div>
  </header>

  <aside id="roster">
    <div class="roster-title">DISTRICTS</div>
    <div id="roster-list"></div>
  </aside>

  <section id="panel" class="closed">
    <button id="panel-close" title="Close">&times;</button>
    <div id="panel-body"></div>
  </section>

  <footer id="ticker"><div id="ticker-track"></div></footer>

  <div id="hint">drag to orbit &middot; scroll to zoom &middot; click a building</div>

</body>
</html>
